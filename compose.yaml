services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: referralflow
      POSTGRES_USER: referralflow
      POSTGRES_PASSWORD: dev_only_change_me
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - referralflow_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U referralflow -d referralflow"]
      interval: 3s
      timeout: 3s
      retries: 15

volumes:
  referralflow_pgdata:
